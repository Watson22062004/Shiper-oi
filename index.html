<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship Ơi! Life v1</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--bg:#e8a56e;--ink:#2b2433;--cream:#fdf0d5;--org:#e0713a;--teal:#2a9d8f;--yel:#e9c46a;--red:#c8412b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a26}}
:root[data-theme="dark"]{--bg:#1d1a26}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%}#fx{pointer-events:none}
#pad{position:fixed;left:0;bottom:0;width:60%;height:60%;touch-action:none}
#stick{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;border:3px solid rgba(253,240,213,.5);border-radius:50%;display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px;border-radius:50%;background:rgba(253,240,213,.75)}
#hint{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font-size:11px;font-weight:800;color:var(--cream);opacity:.55;pointer-events:none}
#hb{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);pointer-events:none}
#hud>*{position:fixed}
#money,#clock{top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--ink);font-weight:800;font-size:14px;padding:6px 12px;border-radius:14px}
#money{left:calc(var(--sl) + 10px);color:var(--yel)}
#clock{left:calc(var(--sl) + 98px);color:var(--cream);white-space:nowrap;min-width:118px;text-align:center;line-height:1.25;padding:5px 10px}
#clock b{display:block;font-size:16px;letter-spacing:.5px}
#clock small{display:block;font-size:10px;opacity:.75;font-weight:700}
#toast{left:50%;top:38%;transform:translateX(-50%);background:var(--ink);color:var(--cream);font-weight:800;font-size:15px;padding:8px 16px;border-radius:16px;opacity:0;pointer-events:none;white-space:nowrap}
#toast.on{animation:tt 1.8s ease-out}@keyframes tt{0%{opacity:1;top:40%}70%{opacity:1}100%{opacity:0;top:34%}}
#prompt{left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);background:rgba(43,36,51,.8);color:var(--cream);font-weight:800;font-size:13px;padding:8px 14px;border-radius:14px;display:none;text-align:center;white-space:nowrap}
#prompt div{margin-top:6px;height:6px;border-radius:3px;background:rgba(253,240,213,.25);overflow:hidden}#pg{display:block;height:100%;width:0;background:var(--yel)}

.pedal{right:calc(var(--sr) + 12px);width:62px;border:0;color:var(--cream);font:800 11px 'Be Vietnam Pro',system-ui,sans-serif;border-radius:16px;touch-action:none;background:rgba(43,36,51,.55)}
.pedal.on{background:var(--org)}
#bg{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:84px;background:rgba(42,157,143,.7)}
#bb{bottom:calc(env(safe-area-inset-bottom,0px) + 112px);height:50px}
#horn{bottom:calc(env(safe-area-inset-bottom,0px) + 172px);height:40px;background:rgba(200,65,43,.75)}#auto{bottom:calc(env(safe-area-inset-bottom,0px) + 218px);height:30px;border-radius:15px;font-size:10px}#auto.on{background:var(--teal)}
@media (orientation:landscape){
#hb{width:min(100%,520px,calc(30vh*3.08))}
#pad{width:40%;height:78%}
#bg{height:64px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}#bb{height:42px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}#horn{bottom:calc(env(safe-area-inset-bottom,0px) + 134px);height:34px}#auto{bottom:calc(env(safe-area-inset-bottom,0px) + 174px)}
#hint{bottom:90px}}
/* ---- phone mounted on the handlebar ---- */
#phmount{position:fixed;left:50%;bottom:env(safe-area-inset-bottom,0px);width:0;height:0;z-index:4;transform-origin:0 0}
#phone{position:absolute;left:0;bottom:var(--pb,40px);width:270px;height:540px;transform-origin:50% 100%;transform:translateX(-50%) scale(var(--ps,.55));background:#1b1822;border-radius:34px;padding:8px;box-sizing:border-box;box-shadow:0 0 0 3px #3a3548,0 12px 28px rgba(0,0,0,.5);z-index:4;touch-action:manipulation}
#phone:not(.big){width:190px;height:340px;border-radius:24px;padding:6px;cursor:pointer;box-shadow:0 0 0 3px #3a3548,0 6px 14px rgba(0,0,0,.55)}
#phone:not(.big) #pscr{border-radius:18px}
#phone:not(.big) #phsb,#phone:not(.big) #phnav,#phone:not(.big) #phinfo{display:none}
#phone:not(.big) #phstrip{display:block}
#phone:not(.big) #pharr{width:56px;height:56px}#phone:not(.big) #phd{font-size:36px}#phone:not(.big) #pht{font-size:15px}#phone:not(.big) #phins{padding:8px 10px;gap:8px}
#phstrip{display:none;flex:none;background:var(--ink);color:var(--cream);font-weight:800;font-size:17px;padding:9px 8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phstrip.new{background:var(--org);animation:blink .8s infinite}@keyframes blink{50%{background:#f08a52}}
#phone.ring{animation:ringp 1s infinite}@keyframes ringp{50%{box-shadow:0 0 0 3px #3a3548,0 0 0 9px rgba(233,196,106,.8)}}
#phone.big{bottom:50vh;transform-origin:50% 50%;transform:translate(-50%,50%) scale(var(--ps,.9));z-index:8}
#pscr{position:relative;width:100%;height:100%;border-radius:27px;background:#f4ecdc;overflow:hidden;display:flex;flex-direction:column;font-size:14px;color:var(--ink)}
#phsb{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:var(--ink);color:var(--cream);font-weight:800;font-size:12px;cursor:pointer;flex:none}#phsb b{color:var(--yel)}
#phx{display:none;border:0;background:var(--red);color:#fff;font:800 15px 'Be Vietnam Pro',system-ui,sans-serif;width:30px;height:24px;border-radius:12px;margin-left:8px;padding:0;cursor:pointer;touch-action:manipulation}
#phone.big #phx{display:block}
#phone.big #phsb{padding:7px 12px}
#phbody{flex:1;display:flex;flex-direction:column;min-height:0}
#phmapw{position:relative;flex:1 1 50%;min-height:0;background:#4b4458}
#phmap{width:100%;height:100%;display:block;object-fit:cover}
#phins{position:absolute;left:8px;right:8px;top:8px;background:rgba(43,36,51,.93);color:var(--cream);border-radius:14px;padding:7px 12px;display:flex;align-items:center;gap:10px}
#pharr{flex:none;transition:transform .2s}#phd{font-size:22px;font-weight:800;display:block;line-height:1.05}#pht{font-size:11px;opacity:.85}
#phinfo{flex:none;padding:10px;background:var(--cream)}
#phinfo>div{display:none;flex-direction:column;gap:7px}
.chip{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--teal);border-radius:8px;padding:2px 8px}.chip.off{background:#8a8494}
.pt{font-weight:800;font-size:16px;line-height:1.15}.pm{font-size:11px;opacity:.75}
.row{display:flex;gap:8px}
.pb{flex:1;border:0;border-radius:12px;padding:10px 6px;font:800 14px 'Be Vietnam Pro',system-ui,sans-serif;background:var(--ink);color:var(--cream);touch-action:manipulation}
.pb.pri{background:var(--org)}.pb.go{background:var(--teal)}.pb:disabled{opacity:.4}
.pbar{height:8px;border-radius:4px;background:rgba(43,36,51,.18);overflow:hidden}.pbar i{display:block;height:100%;width:100%;background:var(--teal)}
.bars{display:flex;gap:6px}.bar{flex:1;height:16px;border-radius:8px;background:rgba(43,36,51,.2);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--teal);border-radius:8px}.bar span{position:absolute;left:7px;top:2px;font-size:10px;font-weight:800;color:var(--cream)}
#phmsg,#phearn{display:none;flex:1;min-height:0;flex-direction:column;padding:10px;gap:8px}
#phchat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.bub{max-width:82%;padding:6px 10px;border-radius:12px;font-size:12px;line-height:1.3}.bub.me{align-self:flex-end;background:var(--teal);color:#fff}.bub.ot{align-self:flex-start;background:#fff}
#phq{display:flex;flex-wrap:wrap;gap:6px}#phq button{border:0;border-radius:14px;padding:6px 10px;font:800 11px 'Be Vietnam Pro',system-ui,sans-serif;background:var(--ink);color:var(--cream)}
#phm{font-size:40px;font-weight:800;color:var(--teal)}
#phnav{display:flex;background:var(--ink);flex:none}#phnav button{flex:1;border:0;background:none;color:var(--cream);padding:9px 0;font:800 11px 'Be Vietnam Pro',system-ui,sans-serif;opacity:.6;position:relative}#phnav button.on{opacity:1;color:var(--yel)}
#phbadge{position:absolute;top:3px;right:14px;background:var(--red);color:#fff;border-radius:8px;font-size:9px;padding:0 5px;font-style:normal;display:none}
#phcall{position:absolute;inset:0;background:rgba(43,36,51,.95);color:var(--cream);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:3;text-align:center}
#phcall b{font-size:20px}#phcall .pb{flex:none;padding:10px 26px}
@media (orientation:landscape){
#phone.big{width:560px;height:262px;border-radius:26px;padding:7px}#phone.big #pscr{border-radius:20px}
#phone.big #phbody{flex-direction:row}#phinfo{width:250px;padding:8px;overflow:hidden}
#phsb{padding:6px 14px}.pt{font-size:14px}.pb{padding:7px 6px;font-size:13px}
#phinfo>div{gap:5px}}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;text-align:center;background:rgba(43,36,51,.92);color:var(--cream);padding:24px;gap:10px;z-index:9}
#fuel,#goal{top:calc(env(safe-area-inset-top,0px) + 46px);height:22px;border-radius:11px;background:rgba(43,36,51,.88);overflow:hidden;font-weight:800;font-size:11px;color:var(--cream);min-width:96px}
#fuel{left:calc(var(--sl) + 10px)}#goal{left:calc(var(--sl) + 114px)}
#snd{left:calc(var(--sl) + 218px);top:calc(env(safe-area-inset-top,0px) + 46px);width:26px;height:22px;border-radius:11px;border:0;background:rgba(43,36,51,.88);color:var(--cream);font:800 13px sans-serif;padding:0}#snd.off{opacity:.5;text-decoration:line-through}
/* ---- Life needs bars ---- */
#needs{position:fixed;left:calc(var(--sl) + 10px);top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:3px;z-index:5;pointer-events:none}
.need{display:flex;align-items:center;gap:5px;background:rgba(43,36,51,.82);border-radius:8px;padding:2px 7px;font-weight:800;font-size:10px;color:var(--cream);min-width:110px}
.need i{display:block;height:8px;border-radius:4px;width:60px;background:rgba(253,240,213,.2);overflow:hidden;position:relative}
.need i b{display:block;height:100%;border-radius:4px;background:var(--teal);width:50%}
/* Mount — left bottom, easy thumb */
#btnMount{position:fixed;left:calc(var(--sl) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:88px;height:52px;border:0;border-radius:18px;background:rgba(43,36,51,.85);color:var(--cream);font:800 13px 'Be Vietnam Pro',system-ui,sans-serif;z-index:6;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#btnMount.on{background:var(--teal)}
@media (orientation:landscape){
#btnMount{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);height:46px;width:80px;font-size:12px}
}
body.walking #bb,body.walking #horn,body.walking #auto{display:none!important}
body.walking #bg{background:rgba(42,157,143,.85)}
body.walking #hb{display:none!important}
body.walking #phmount{bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
@media (orientation:landscape){
body.walking #bg{height:56px}
body.walking #phmount{bottom:calc(env(safe-area-inset-bottom,0px) + 55px)}
}
/* Context interact — only when near something */
#btnAct{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:7;border:0;border-radius:18px;padding:14px 28px;font:800 15px 'Be Vietnam Pro',system-ui,sans-serif;background:var(--org);color:var(--cream);display:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:nowrap}
#btnAct.go{background:var(--teal)}
@media (orientation:landscape){#btnAct{bottom:calc(env(safe-area-inset-bottom,0px) + 72px);padding:12px 22px;font-size:14px}}
/* Tiny tuck-phone button */
#btnPhone{position:fixed;right:calc(var(--sr) + 10px);top:calc(env(safe-area-inset-top,0px) + 78px);z-index:6;width:34px;height:34px;border:0;border-radius:11px;background:rgba(43,36,51,.82);color:var(--cream);font:800 15px sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0;line-height:1}
#btnPhone.off{opacity:.5}
#phmount.hidden{visibility:hidden;pointer-events:none}
#phmus{display:none;flex:1;min-height:0;flex-direction:column;padding:10px;gap:7px;overflow:auto}
#mviz{width:100%;height:34px;background:rgba(43,36,51,.08);border-radius:8px}
#mlist{display:flex;flex-direction:column;gap:4px}#mlist button{border:0;border-radius:9px;padding:6px 10px;text-align:left;font:800 12px 'Be Vietnam Pro',system-ui,sans-serif;background:rgba(43,36,51,.08);color:var(--ink)}#mlist button.on{background:var(--teal);color:#fff}#mlist small{opacity:.7;font-weight:600;margin-left:6px}
.vol{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800}.vol input{flex:1;accent-color:var(--teal)}
#fuel i,#goal i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--teal);opacity:.85}
#fuel span,#goal span{position:relative;display:block;padding:4px 10px;white-space:nowrap}
#sigw{right:calc(var(--sr) + 10px);top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--cream);border-radius:16px;padding:6px 12px;font-weight:800;font-size:15px}
#sigl{width:28px;height:28px;border-radius:50%;background:#666;flex:none}
#sigw div:last-child{display:flex;flex-direction:column;line-height:1.1}#sigd{font-size:10px;opacity:.7}
#rdt{right:calc(var(--sr) + 10px);top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--teal);color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:10px;display:none}
.ovc{margin:auto;display:flex;flex-direction:column;align-items:center;gap:9px;max-width:340px;width:100%;padding:14px 0}
.gr{display:flex;align-items:center;gap:8px;background:rgba(253,240,213,.1);border-radius:12px;padding:8px 10px;width:100%;box-sizing:border-box;text-align:left}
.gr b{display:block;font-size:13px}.gr small{opacity:.75;font-size:11px}
#ov .gr button{margin:0;padding:8px 12px;font-size:13px;box-shadow:none;background:var(--teal);min-width:62px}#ov .gr button:disabled{opacity:.4;background:#666}
.gt{font-weight:800;font-size:13px;color:var(--yel);align-self:flex-start;margin-top:4px}.cash{font-size:14px!important}
.sum{background:rgba(253,240,213,.1);border-radius:12px;padding:10px 14px;line-height:1.7;font-size:14px;width:100%;box-sizing:border-box}
#ov h1{margin:0;font-size:46px;font-weight:800;letter-spacing:-1px;color:var(--yel);transform:rotate(-3deg)}
#ov p{margin:0;font-size:14px;line-height:1.55;max-width:300px;opacity:.92}
#ov button{margin-top:12px;font:800 17px 'Be Vietnam Pro',system-ui,sans-serif;background:var(--org);color:var(--cream);border:0;border-radius:14px;padding:14px 30px;box-shadow:0 5px 0 #8f3f1d}
</style></head><body>

<div id="phinfo">

  const tm=()=>{const t=new THREE.MeshBasicMaterial({color:0x6a2620});tl.push(t);return t};
  let rad=3.2,v=11;
  if(kind==='fire'){rad=4.2;v=10;
    m.add(rmesh(2.5,8.5,2.6,.7,P.red,0,.5,0),rmesh(2.4,3,.6,.3,P.ink,0,1.9,-1.5),rmesh(2.2,2.5,1.2,.3,P.navy,0,1.6,2.5));
  }else if(kind==='police'){rad=2.6;v=13;
    m.add(rmesh(2.1,4.4,.95,.65,'#e8e8ec',0,.4,0),rmesh(1.8,2.2,.5,.5,P.ink,0,1.3,.25));
    m.add(rmesh(1.7,2,.12,.5,'#e8e8ec',0,1.75,.25),rmesh(.9,.28,.2,.08,P.navy,0,1.9,.2));
  }else{
    rad=3.4;v=12;
    m.add(rmesh(2.3,5.2,2.1,.55,P.cream,0,.45,0),rmesh(2.34,2.8,.5,.3,P.ink,0,1.55,.6),rmesh(2,.35,.9,.1,P.red,0,1.4,-2.3));
  }
  [[-1.1,-1.6],[1.1,-1.6],[-1.1,1.6],[1.1,1.6]].forEach(([x,z])=>{const w=mesh(new THREE.CylinderGeometry(.38,.38,.28,12),P.ink,x,.38,z);w.rotation.z=Math.PI/2;m.add(w)});
  m.add(mesh(new THREE.SphereGeometry(.12,8,6),0xffe9a0,-.7,.9,-2.3),mesh(new THREE.SphereGeometry(.12,8,6),0xffe9a0,.7,.9,-2.3));
  m.add(mesh(new THREE.SphereGeometry(.1,8,6),tm(),-.7,.9,2.3),mesh(new THREE.SphereGeometry(.1,8,6),tm(),.7,.9,2.3));
  const fl1=mkFlasher(kind==='police'?0x4488ff:0xff2222),fl2=mkFlasher(kind==='police'?0xff2222:0xffee44);
  fl1.position.set(-.4,2.15,0);fl2.position.set(.4,2.15,0);m.add(fl1,fl2);

function mkEmergency(kind,x,z,dx,dz){

function alongSeg(seg,t,side){
  // t 0..1 along segment, side -1/0/1 lateral
  const len=(seg.a1-seg.a0),a=seg.a0+len*t;
  const lat=(side||0)*2.4;
  if(seg.ax)return {x:a,z:seg.z+lat,ry:seg.val===-1?Math.PI:0};
  return {x:seg.x+lat,z:a,ry:seg.val===-1?-Math.PI/2:Math.PI/2};
}

function zoneSlow(x,z){
  let s=1;
  for(const e of trafEv){
    if(!e.r)continue;
    const d=Math.hypot(x-e.x,z-e.z);
    if(d<e.r){if(e.slow<=0)s=Math.min(s,0.02);else s=Math.min(s,e.slow+(d/e.r)*(1-e.slow))}
  }
  return s;
}
function nearEmergency(x,z){
  for(const e of trafEv){
    if(e.car&&Math.hypot(e.car.px-x,e.car.pz-z)<22)return e;
    if(e.fug&&Math.hypot(e.fug.px-x,e.fug.pz-z)<22)return e;
  }return null;
}
function updateTraf(dt){
  if(mode!=='play')return;
  trafCD-=dt;if(trafCD<=0){spawnTraf();trafCD=16+Math.random()*22}
  sirenT+=dt;
  for(let i=trafEv.length-1;i>=0;i--){
    const e=trafEv[i];e.t+=dt;
    // flash emergency lights (moving + static at accident)
    const flash=(fl,spd)=>{if(!fl)return;const on=Math.sin(sirenT*spd)>0;fl[0].visible=on;fl[1].visible=!on};
    if(e.car&&e.car.fl)flash(e.car.fl,14);
    if(e.fug&&e.fug.fl)flash(e.fug.fl,16);
    if(e.fl)flash(e.fl,12);if(e.fl2)flash(e.fl2,13);
    // animate event people (police, workers, civs)
    if(e.people)for(const p of e.people){
      if(!p||!p.g)continue;
      const near=Math.hypot(p.g.position.x-cam.position.x,p.g.position.z-cam.position.z)<95;
      p.g.visible=near;if(!near)continue;
      p.t=(p.t||0)+dt;
      const pose=p.pose;
      if(pose==='patrol'&&p.patrol){
        if(p.state!=='walk'||p.arrived){
          const ang=Math.random()*6.28;p.tx=p.patrol.ox+Math.cos(ang)*p.patrol.r;p.tz=p.patrol.oz+Math.sin(ang)*p.patrol.r;
          p.state='walk';p.arrived=false;
        }
        // walk handled by world(); baton sway
        if(p.prop)p.prop.rotation.z=Math.sin(p.t*6)*.2;
      }else if(pose==='direct'){
        // traffic directing — arm sweep
        p.aR.rotation.z=-1.1+Math.sin(p.t*2.2)*.45;
        p.aR.rotation.x=-.1+Math.sin(p.t*2.2)*.15;
        p.aL.rotation.x=-.2;
        p.body.rotation.y=Math.sin(p.t*1.1)*.12;
      }else if(pose==='radio'){
        p.aL.rotation.x=-1.5+Math.sin(p.t*1.5)*.05;
        p.aL.rotation.z=.4;
        p.body.rotation.y=Math.sin(p.t*.8)*.06;
        if(p.prop)p.prop.rotation.x=Math.sin(p.t*3)*.1;
      }else if(pose==='write'){
        p.aR.rotation.x=-1.05+Math.sin(p.t*3)*.08;
        p.aL.rotation.x=-.85;
        p.body.rotation.x=.1;
      }else if(pose==='dig'||pose==='work'){
        // shovel dig cycle
        const cy=Math.sin(p.t*3.2);
        p.aR.rotation.x=-.4+cy*.55;
        p.aL.rotation.x=-.3+cy*.25;
        p.body.rotation.x=.05+cy*.08;
        p.g.position.y=Math.max(0,cy)*.04;
        if(p.prop)p.prop.rotation.x=cy*.4;
      }else if(pose==='hammer'){
        const cy=Math.sin(p.t*5);
        p.aR.rotation.x=-.5+cy*.7;
        if(p.prop)p.prop.rotation.x=-.3+cy*.5;
        p.body.rotation.x=cy>0?cy*.06:0;
      }else if(pose==='carry'){
        p.aL.rotation.x=-1.25;p.aR.rotation.x=-1.25;
        p.body.position.y=Math.abs(Math.sin(p.t*4))*.025;
        // slow shuffle in place
        p.g.rotation.y+=Math.sin(p.t*.7)*.002;
      }else if(pose==='argue'){
        p.aL.rotation.x=-1+Math.sin(p.t*5)*.25;p.aR.rotation.x=-1.1+Math.sin(p.t*5+.7)*.25;p.body.rotation.y=Math.sin(p.t*2)*.1;
      }else if(pose==='phone'){
        p.aR.rotation.x=-1.45;p.aR.rotation.z=.35+Math.sin(p.t*1.5)*.05;p.body.rotation.x=-.08;
      }else if(pose==='wave')stepP(p,dt);
      else{p.body.position.y=Math.sin(p.t*1.2)*.01}
    }
    if(e.kind==='chase'&&e.car&&e.fug){
      const d=Math.hypot(e.fug.px-e.car.px,e.fug.pz-e.car.pz)||1;
      if(d<8){toast('Cảnh sát đã bắt đối tượng!');e.t=e.dur}
    }
    if(e.t>=e.dur){
      e.objs.forEach(o=>{try{scene.remove(o)}catch(err){}});
      if(e.people)e.people.forEach(p=>{const ix=amb.indexOf(p);if(ix>=0)amb.splice(ix,1)});
      if(e.car){scene.remove(e.car.m);const ix=npcs.indexOf(e.car);if(ix>=0)npcs.splice(ix,1)}
      if(e.fug){scene.remove(e.fug.m);const ix=npcs.indexOf(e.fug);if(ix>=0)npcs.splice(ix,1)}
      trafEv.splice(i,1);
    }
  }
}
function applyTrafPlayer(dt){
  if(!pl.onBike||inHouse)return;
  const zs=zoneSlow(pl.x,pl.z);
  if(zs<0.15){if(Math.abs(sp)>2){sp*=.85;if(Math.random()<dt*1.2)toast(pick(['Tắc đường không nhúc nhích…','Kẹt cứng rồi anh ơi!','Xe máy len từng chút!']))}}
  else if(zs<0.5){sp=Math.min(sp,6*zs+2)}
  const em=nearEmergency(pl.x,pl.z);
  if(em&&em.car){
    const d=Math.hypot(em.car.px-pl.x,em.car.pz-pl.z);
    if(d<16&&Math.abs(sp)>8){
      if(!em.warn){em.warn=true;toast(em.kind==='chase'||em.car.emerg==='police'?'🚓 Nhường đường cho cảnh sát!':'🚑 Nhường đường xe ưu tiên!');sfx('warn')}
      if(Math.abs(sp)>12&&d<10){spend(5);sp*=.4;shake=.35;toast('Cản đường xe ưu tiên! Phạt -5k');sfx('fine');em.warn=false}
    }
  }
  // road work / accident block — soft solid
  for(const e of trafEv){
    if((e.kind==='repair'||e.kind==='accident')&&Math.hypot(pl.x-e.x,pl.z-e.z)<e.r*.55){
      if(Math.abs(sp)>3){sp*=.5;shake=Math.max(shake,.25);if(Math.random()<dt*2)toast(e.kind==='repair'?'Đụng rào chắn công trường!':'Gần hiện trường tai nạn — đi chậm!')}
    }
  }
}

  h=h==null?hour:h;

  if(h>=8&&h<11)return {id:'morn',label:'Buổi sáng',icon:'☀️'};

function decayNeeds(dt){
  const m=dt*TIME_SCALE*60; // game minutes
  const p=periodOf().id;
  // rates vary by time of day (more realistic)
  let hRate=.045,eRate=.028,gRate=.016,mRate=.012;
  if(p==='noon'){hRate=.07;eRate=.04} // hot noon → hungrier, tireder
  if(p==='night'){eRate=.045;mRate=.025} // night → exhausted, low mood
  if(p==='rush'||isRush()){eRate*=1.25;mRate*=1.15}
  if(pl.onBike&&Math.abs(sp)>3){eRate*=1.2;hRate*=1.15} // working burns more
  if(inHouse){eRate*=.5;hRate*=.7;gRate*=.4} // rest at home slower drain
  hung=Math.max(0,hung-m*hRate);
  eng=Math.max(0,eng-m*eRate);
  hyg=Math.max(0,hyg-m*gRate);
  mood=Math.max(0,mood-m*mRate);
  if(hung<20)eng=Math.max(0,eng-m*0.04);
  if(eng<15)mood=Math.max(0,mood-m*0.05);
  if(hyg<15)mood=Math.max(0,mood-m*0.04);
  // soft warnings
  needWarnT-=dt;
  if(needWarnT<=0){
    if(hung<18){toast('🍜 Đói bụng quá — cần ăn!');needWarnT=25}
    else if(eng<15){toast('⚡ Mệt lả — về nhà nghỉ hoặc ngủ!');needWarnT=25}
    else if(hyg<15){toast('🧼 Bẩn quá — nên tắm!');needWarnT=28}
    else if(mood<15){toast('😔 Tâm trạng xuống — ăn uống / nghỉ ngơi!');needWarnT=28}
    else if(p==='night'&&eng<40&&!inHouse){toast('🌙 Đêm rồi, về nhà ngủ đi...');needWarnT=40}
  }
}

function updContextBtn(){
  const btn=$('btnAct');
  if(houseAnim||mode!=='play'){btn.style.display='none';ctxAction=null;return}
  // outside: near house door
  if(!inHouse&&!pl.onBike&&nearHouse()){
    btn.style.display='block';btn.textContent='Vào nhà';btn.className='go';ctxAction='enter';return}
  if(!inHouse&&nearMarket()&&!pl.onBike){
    if(isMarketOpen()){btn.style.display='block';btn.textContent='Mua nguyên liệu (−12k)';btn.className='';ctxAction='buy';return}
    else{btn.style.display='block';btn.textContent='Chợ đóng (6:00–21:00)';btn.className='';ctxAction=null;return}
  }
  // inside house zones
  if(inHouse){
    const z=nearestZone();
    if(z==='bed'&&eng<=90){btn.style.display='block';btn.textContent='Ngủ';btn.className='pri';ctxAction='sleep';return}
    if(z==='cook'&&foodStock>0&&hung<=85){btn.style.display='block';btn.textContent='Nấu ăn';btn.className='';ctxAction='cook';return}
    if(z==='shower'&&hyg<=85){btn.style.display='block';btn.textContent='Tắm';btn.className='';ctxAction='shower';return}
    if(z==='desk'&&rentDue>=1){btn.style.display='block';btn.textContent='Đóng trọ ('+(RENT_COST+ELEC_COST)+'k)';btn.className='';ctxAction='rent';return}
    if(z==='door'){btn.style.display='block';btn.textContent='Ra ngoài';btn.className='go';ctxAction='exit';return}
  }
  btn.style.display='none';ctxAction=null;
}
function doContext(){

  else if(ctxAction==='shower')doShower();
  else if(ctxAction==='rent')payRent();
  else if(ctxAction==='buy')buyFood();
}

// Fare: base + distance + weight + alley + surge
function calcFare(ride,d0,d1,weight,alley,mult){
  const km=(d0+d1)/1000;
  const base=ride?12:10;          // phí mở đơn
  const perKm=ride?9:7;           // theo km
  const distFee=km*perKm;
  const wFee=ride?0:Math.round(weight*2.5); // ~2.5k / kg
  const alleyFee=alley?6:0;
  const raw=base+distFee+wFee+alleyFee;
  return Math.max(ride?18:15,Math.round(raw*mult));
}
